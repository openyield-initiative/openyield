[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openyield"
version = "0.1.0"
description = "Scripted narrow-road research simulation foundation"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "mkdocs>=1.6,<2"]

[project.scripts]
openyield = "openyield.cli:main"

[tool.setuptools.package-data]
openyield = ["scenarios/*.json", "replay/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
